name: atlas-sidecar-word
version: 1.2.0
manifest_version: 2
author: Atlas Omnia
license: Apache-2.0
description: >-
  Sidecar for Word — chat with Hermes in a sidebar inside desktop Word for Mac while
  Hermes reads, reviews and edits the open document through sidecar_word_* tools. The plugin serves its bundled
  sidebar at https://localhost:47630/sidecar-word/ (actual bound port in 47630-47634) over its HTTPS loopback
  bridge. GitHub Pages or another host is not required; a self-hosted site remains possible through addin_base.
  The bridge forwards the sidebar's chat to your Hermes API server. Each sidebar connects only after you allow it
  in Hermes (/sidecar-word); the approval is remembered until /sidecar-word revoke. Requires one manual user trust
  step for its local CA.
python_dependencies:
  - "cryptography>=43"
requires_hermes: ">=0.23.0"
platforms: [macos]  # Windows desktop Word untested
tags: [office, word, desktop, sidebar, documents]
kind: standalone
requires_env:
  - name: API_SERVER_KEY
    description: "Your Hermes API server key (the same API_SERVER_KEY that enables the API server). The sidebar's chat goes to your local API server; the plugin reads this key through Hermes and never stores or shows it."
    secret: true
config_schema:
  addin_base:
    type: str
    default: "https://localhost:47630/sidecar-word/"
    label: "Sidebar base URL"
    description: "HTTPS base URL of the Word sidebar. By default the plugin serves its bundled sidebar at https://localhost:47630/sidecar-word/ (the actual bound port is used at runtime). Set a self-hosted HTTPS build here to override the bundled page; the bridge accepts only this site's exact origin."
  api_server_url:
    type: str
    default: "http://127.0.0.1:8642"
    label: "Hermes API server"
    description: "Loopback URL of your Hermes API server (http://127.0.0.1:<port>)."
  autostart:
    type: bool
    default: true
    label: "Start the bridge with the gateway"
    description: "Start the sidebar bridge when the Hermes gateway (which runs the API server) loads this plugin. Off: it starts on the first /sidecar-word command or sidecar_word_* tool call."
provides_tools:
  - sidecar_word_get_document_overview
  - sidecar_word_read_selection
  - sidecar_word_read_document_text
  - sidecar_word_apply_edit_plan
  - sidecar_word_insert_text
  - sidecar_word_replace_selection
  - sidecar_word_find_replace
  - sidecar_word_format_selection
  - sidecar_word_get_document_structure
  - sidecar_word_apply_style
  - sidecar_word_insert_ooxml
  - sidecar_word_insert_comment
provides_hooks: []
